services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    networks:
      - pipeline-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ciWo0R1yRuWCXbdBz9G3yA
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      # Explicit named volume, not the image's implicit anonymous ones — anonymous volumes were
      # observed NOT being reliably removed by `docker compose down -v` in this environment,
      # causing Kafka topic data (and therefore loaded row counts) to survive a "clean" reset.
      # Named volumes are removed reliably by `down -v`. Required for the judges' reproducibility
      # check (handout: "down -v" then "up" on the same CSV must show identical counts).
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5.24-community
    hostname: neo4j
    networks:
      - pipeline-net
    user: "7474:7474"  # image's built-in non-root neo4j user — default is root, req #9 mandates non-root
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-csvgraphdb}
      # Neo4j 5.x database names may only contain ASCII letters, digits, dots, and dashes — no
      # underscores. The event's fixed name "CSV_Graph_DB" is rejected outright by Neo4j itself
      # ("contains illegal characters"), so we substitute dashes: csv-graph-db.
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-csv-graph-db}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      # Same reasoning as kafka's named volume above — the image's implicit anonymous /data and
      # /logs volumes were observed surviving `docker compose down -v`.
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 40s

  api:
    build: ./api
    networks:
      - pipeline-net
    ports:
      - "${API_PORT:-8000}:8000"

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-csvgraphdb}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-csv-graph-db}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  loader:
    build: ./loader
    networks:
      - pipeline-net
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-csvgraphdb}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-csv-graph-db}
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ui:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    networks:
      - pipeline-net
    ports:
      - "${UI_PORT:-3000}:8080"

    volumes:
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  pipeline-net:
    driver: bridge

volumes:
  kafka_data:
  neo4j_data:
  neo4j_logs:
