services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ciWo0R1yRuWCXbdBz9G3yA
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-csvgraphdb}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-CSV_Graph_DB}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-csvgraphdb} 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKERS: kafka:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-csvgraphdb}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-CSV_Graph_DB}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  loader:
    build: ./loader
    environment:
      KAFKA_BROKERS: kafka:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-csvgraphdb}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-CSV_Graph_DB}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  ui:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - api
