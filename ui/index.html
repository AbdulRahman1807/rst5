<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CSV → Kafka → Neo4j → Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  section { margin-bottom: 32px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
  pre { background: #f5f5f5; padding: 8px; overflow-x: auto; white-space: pre-wrap; }
  input, button { font-size: 1rem; padding: 6px 10px; }
</style>
</head>
<body>
  <h1>CSV → Kafka → Neo4j → Chat</h1>

  <!-- TODO(Nitika): real upload/preview/progress UI. This is a bare-bones stub so the skeleton is clickable end to end. -->
  <section>
    <h2>1. Upload CSV</h2>
    <input type="file" id="file" accept=".csv">
    <button onclick="upload()">Upload</button>
    <pre id="ingest-result"></pre>
  </section>

  <section>
    <h2>2. Status</h2>
    <button onclick="checkStatus()">Refresh status</button>
    <pre id="status-result"></pre>
  </section>

  <section>
    <h2>3. Ask a question</h2>
    <input type="text" id="question" placeholder="How many rows belong to the Billing group?" style="width: 70%">
    <button onclick="ask()">Ask</button>
    <pre id="chat-result"></pre>
  </section>

<script>
const API = window.location.hostname + ':8000';
let jobId = null;

async function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('choose a file first');
  const form = new FormData();
  form.append('file', f);
  const res = await fetch(`http://${API}/ingest`, { method: 'POST', body: form });
  const data = await res.json();
  jobId = data.job_id;
  document.getElementById('ingest-result').textContent = JSON.stringify(data, null, 2);
}

async function checkStatus() {
  if (!jobId) return alert('upload a file first');
  const res = await fetch(`http://${API}/status?job_id=${jobId}`);
  const data = await res.json();
  document.getElementById('status-result').textContent = JSON.stringify(data, null, 2);
}

async function ask() {
  const question = document.getElementById('question').value;
  const res = await fetch(`http://${API}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  const data = await res.json();
  document.getElementById('chat-result').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
