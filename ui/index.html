<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data In, Answers Out</title>

<!-- React 18 UMD builds + Babel standalone for in-browser JSX compilation -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin onerror="this.onerror=null;this.src='vendor/react.production.min.js'"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin onerror="this.onerror=null;this.src='vendor/react-dom.production.min.js'"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onerror="this.onerror=null;this.src='vendor/babel.min.js'"></script>
<script>
  // Robust fallback in case network blocks external unpkg and onerror didn't trigger
  if (!window.React) {
    document.write('<script src="vendor/react.production.min.js"><\/script>');
    document.write('<script src="vendor/react-dom.production.min.js"><\/script>');
    document.write('<script src="vendor/babel.min.js"><\/script>');
  }
</script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    padding: 2rem;
    line-height: 1.5;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #9aa0a6; margin-bottom: 2rem; font-size: 0.9rem; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 1rem 0;
    color: #c8cbd0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Upload zone */
  .dropzone {
    border: 2px dashed #3a3f4b;
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #5b8def;
    background: #161a22;
  }
  .dropzone input { display: none; }
  .dropzone p { margin: 0; color: #9aa0a6; }
  .dropzone .filename { color: #e6e6e6; font-weight: 600; margin-top: 0.5rem; }

  .error-box {
    background: #3a1f1f;
    border: 1px solid #7a3a3a;
    color: #ffb3b3;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    margin-top: 1rem;
    font-size: 0.9rem;
  }

  /* Ingest result */
  .meta-row {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .meta-item { font-size: 0.85rem; color: #9aa0a6; }
  .meta-item strong { color: #e6e6e6; display: block; font-size: 1rem; }

  /* Status badges */
  .status-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-queued { background: #3a3520; color: #e0c96b; }
  .status-loading { background: #1f3550; color: #7db4f0; }
  .status-complete { background: #1f3d28; color: #6bd68a; }
  .status-failed { background: #3a1f1f; color: #ff8080; }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #3a3f4b;
    border-top-color: #7db4f0;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stretch Goal #1: Live Progress Bar */
  .progress-wrap {
    margin-top: 1rem;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #12151b;
    border: 1px solid #2a2e37;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: #5b8def;
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #9aa0a6;
    margin-top: 0.35rem;
  }

  /* Stretch Goal #4: Failed count visual distinction */
  .failed-badge {
    color: #ff8080 !important;
    font-weight: 700;
  }

  /* Stretch Goal #3: Reset Button */
  .btn-reset {
    background: transparent;
    border: 1px solid #3a3f4b;
    color: #9aa0a6;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .btn-reset:hover {
    background: #2a2e37;
    color: #fff;
  }

  /* Preview table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    font-size: 0.85rem;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #2a2e37;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  th { color: #9aa0a6; font-weight: 600; }
  .table-wrap { overflow-x: auto; }

  /* Stretch Goal #2: Example prompt chips */
  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .chip {
    background: #12151b;
    border: 1px solid #2a2e37;
    color: #9aa0a6;
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover {
    border-color: #5b8def;
    color: #e6e6e6;
    background: #1a1e28;
  }

  /* Chat */
  .chat-input-row { display: flex; gap: 0.5rem; }
  input[type="text"] {
    flex: 1;
    background: #12151b;
    border: 1px solid #2a2e37;
    color: #e6e6e6;
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  input[type="text"]:focus { outline: none; border-color: #5b8def; }
  button.action-btn {
    background: #5b8def;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  button.action-btn:hover { background: #4a7bd9; }
  button.action-btn:disabled { background: #3a3f4b; cursor: not-allowed; }

  .chat-answer {
    margin-top: 1rem;
    padding: 1rem;
    background: #12151b;
    border-radius: 8px;
    border-left: 3px solid #5b8def;
  }
  .chat-answer.ungrounded { border-left-color: #e0a03a; }
  .chat-answer-text { font-size: 1rem; margin-bottom: 0.5rem; }

  .grounded-badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  .grounded-true { background: #1f3d28; color: #6bd68a; }
  .grounded-false { background: #3a2f1f; color: #e0a03a; }

  details {
    margin-top: 0.5rem;
    font-size: 0.8rem;
  }
  summary {
    cursor: pointer;
    color: #9aa0a6;
    margin-bottom: 0.5rem;
  }
  pre {
    background: #0a0c10;
    border: 1px solid #2a2e37;
    border-radius: 6px;
    padding: 0.75rem;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: #a8e0c0;
    margin: 0.25rem 0;
  }

  .empty-state { color: #6b6f78; font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const API_BASE = "http://localhost:8000";

  function App() {
    // 1. Upload state
    const [fileName, setFileName] = useState("");
    const [isDragOver, setIsDragOver] = useState(false);
    const [uploadError, setUploadError] = useState("");
    const [jobMeta, setJobMeta] = useState(null); // { job_id, rows_received, status }
    const fileInputRef = useRef(null);

    // 2. Preview & Status state
    const [previewRows, setPreviewRows] = useState([]);
    const [previewHeaders, setPreviewHeaders] = useState([]);
    const [previewTotalRows, setPreviewTotalRows] = useState(0);
    const [statusData, setStatusData] = useState(null);
    const [statusError, setStatusError] = useState("");
    const [isPolling, setIsPolling] = useState(false);

    // 3. Chat state
    const [question, setQuestion] = useState("");
    const [isAsking, setIsAsking] = useState(false);
    const [chatError, setChatError] = useState("");
    const [chatResult, setChatResult] = useState(null);

    // File selection & upload logic (Identical to vanilla logic)
    const handleFile = async (file) => {
      if (!file) return;
      setUploadError("");
      setFileName(file.name);

      // Client-side preview parse (first 10 rows)
      try {
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length > 0) {
          const header = lines[0].split(",");
          const rows = lines.slice(1, 11).map(l => l.split(","));
          setPreviewHeaders(header);
          setPreviewRows(rows);
          setPreviewTotalRows(lines.length - 1);
        } else {
          setPreviewHeaders([]);
          setPreviewRows([]);
          setPreviewTotalRows(0);
        }
      } catch (err) {
        console.error("Preview parse failed:", err);
      }

      // Upload to API
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API_BASE}/ingest`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Server returned ${res.status}: ${body}`);
        }
        const data = await res.json();
        setJobMeta(data);
        setStatusData({
          status: data.status || "queued",
          rows_total: data.rows_received,
          rows_loaded: 0,
          rows_failed: 0,
        });
        setIsPolling(true);
      } catch (err) {
        setUploadError(`Upload failed: ${err.message}. Is the API running at ${API_BASE}?`);
        console.error(err);
      }
    };

    // Status polling effect: polls /status?job_id=... every 1.5s until complete or failed
    useEffect(() => {
      if (!isPolling || !jobMeta?.job_id) return;

      const fetchStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/status?job_id=${encodeURIComponent(jobMeta.job_id)}`);
          if (!res.ok) {
            setStatusError(`Could not fetch status (${res.status}).`);
            setIsPolling(false);
            return;
          }
          const data = await res.json();
          setStatusData(data);

          if (data.status === "complete" || data.status === "failed") {
            setIsPolling(false);
          }
        } catch (err) {
          setStatusError(err.message);
          setIsPolling(false);
          console.error(err);
        }
      };

      fetchStatus(); // immediate first check
      const timer = setInterval(fetchStatus, 1500);
      return () => clearInterval(timer);
    }, [isPolling, jobMeta?.job_id]);

    // Chat submit logic (Identical to vanilla logic)
    const handleAsk = async (qText) => {
      const q = (qText !== undefined ? qText : question).trim();
      if (!q || isAsking) return;

      setChatError("");
      setIsAsking(true);

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Server returned ${res.status}: ${body}`);
        }
        const data = await res.json();
        setChatResult(data);
      } catch (err) {
        setChatError(`Chat failed: ${err.message}`);
        console.error(err);
      } finally {
        setIsAsking(false);
      }
    };

    // Stretch Goal #3: Reset all state without full page reload
    const handleReset = () => {
      setFileName("");
      setUploadError("");
      setJobMeta(null);
      setPreviewRows([]);
      setPreviewHeaders([]);
      setPreviewTotalRows(0);
      setStatusData(null);
      setStatusError("");
      setIsPolling(false);
      setQuestion("");
      setChatError("");
      setChatResult(null);
      if (fileInputRef.current) fileInputRef.current.value = "";
    };

    // Calculate progress percentage for Stretch Goal #1
    const progressPct = statusData && statusData.rows_total > 0
      ? Math.min(100, Math.round(((statusData.rows_loaded || 0) / statusData.rows_total) * 100))
      : 0;

    return (
      <div className="container">
        <h1>Data In, Answers Out</h1>
        <p className="subtitle">Upload a CSV, watch it load into the graph, then ask questions about it.</p>

        {/* 1. Upload Card */}
        <div className="card">
          <h2>
            <span>1. Upload CSV</span>
            {jobMeta && (
              <button className="btn-reset" onClick={handleReset} title="Reset all state without refreshing">
                Reset / New Upload
              </button>
            )}
          </h2>
          <div
            className={`dropzone ${isDragOver ? "dragover" : ""}`}
            id="dropzone"
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
            onDragLeave={() => setIsDragOver(false)}
            onDrop={(e) => {
              e.preventDefault();
              setIsDragOver(false);
              if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            }}
          >
            <input
              type="file"
              id="fileInput"
              ref={fileInputRef}
              accept=".csv"
              onChange={(e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
              }}
            />
            <p id="dropzoneText">{fileName ? "File selected" : "Drag a CSV here, or click to browse"}</p>
            {fileName && <div className="filename" id="filename">{fileName}</div>}
          </div>

          {uploadError && <div className="error-box" id="uploadError">{uploadError}</div>}

          {jobMeta && (
            <div className="meta-row" id="ingestMeta">
              <div className="meta-item">Job ID<strong id="metaJobId">{jobMeta.job_id ?? "—"}</strong></div>
              <div className="meta-item">Rows received<strong id="metaRowsReceived">{jobMeta.rows_received ?? "—"}</strong></div>
              <div className="meta-item">Status<strong id="metaStatus">{jobMeta.status ?? "—"}</strong></div>
            </div>
          )}
        </div>

        {/* 2. Preview + status card */}
        <div className="card">
          <h2>2. Preview &amp; Load Status</h2>
          <div id="statusPanel">
            {!statusData && !statusError && (
              <div className="empty-state">No file uploaded yet.</div>
            )}
            {statusError && (
              <div>
                <span className="status-badge status-failed">error</span> {statusError}
              </div>
            )}
            {statusData && (
              <div>
                {(statusData.status === "queued" || statusData.status === "loading") && (
                  <span className="spinner"></span>
                )}
                <span className={`status-badge status-${statusData.status || "unknown"}`}>
                  {statusData.status || "unknown"}
                </span>
                <div className="meta-row">
                  <div className="meta-item">Total<strong>{statusData.rows_total ?? "—"}</strong></div>
                  <div className="meta-item">Loaded<strong>{statusData.rows_loaded ?? "—"}</strong></div>
                  <div className="meta-item">
                    Failed
                    <strong className={statusData.rows_failed > 0 ? "failed-badge" : ""}>
                      {statusData.rows_failed ?? "—"}
                    </strong>
                  </div>
                </div>

                {/* Stretch Goal #1: Live Progress Bar */}
                <div className="progress-wrap">
                  <div className="progress-bar-bg">
                    <div className="progress-bar-fill" style={{ width: `${progressPct}%` }}></div>
                  </div>
                  <div className="progress-label">
                    <span>Ingest Progress</span>
                    <span>{progressPct}% ({statusData.rows_loaded ?? 0} / {statusData.rows_total ?? 0})</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="table-wrap" id="previewTableWrap">
            {previewHeaders.length > 0 && (
              <>
                <table>
                  <thead>
                    <tr>
                      {previewHeaders.map((h, i) => (
                        <th key={i}>{h.trim()}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {previewRows.map((r, rIdx) => (
                      <tr key={rIdx}>
                        {r.map((cell, cIdx) => (
                          <td key={cIdx}>{(cell || "").trim()}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
                {previewTotalRows > 10 && (
                  <div className="empty-state" style={{ marginTop: "0.5rem" }}>
                    Showing first 10 of {previewTotalRows} rows (preview only — server parses the full file).
                  </div>
                )}
              </>
            )}
          </div>
        </div>

        {/* 3. Chat card */}
        <div className="card">
          <h2>3. Ask Your Data</h2>

          {/* Stretch Goal #2: Example question suggestion chips */}
          <div className="example-chips">
            <span style={{ fontSize: "0.75rem", color: "#6b6f78", alignSelf: "center", marginRight: "0.25rem" }}>
              Quick prompts:
            </span>
            {[
              "How many rows in total?",
              "What columns exist in this dataset?",
              "Show top 5 by amount",
              "How many rows belong to Billing?"
            ].map((chipText, i) => (
              <button
                key={i}
                type="button"
                className="chip"
                onClick={() => {
                  setQuestion(chipText);
                  handleAsk(chipText);
                }}
                disabled={isAsking}
              >
                {chipText}
              </button>
            ))}
          </div>

          <div className="chat-input-row">
            <input
              type="text"
              id="chatInput"
              placeholder="How many rows belong to Billing?"
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") handleAsk();
              }}
              disabled={isAsking}
            />
            <button
              id="chatBtn"
              className="action-btn"
              onClick={() => handleAsk()}
              disabled={isAsking || !question.trim()}
            >
              {isAsking ? "Asking…" : "Ask"}
            </button>
          </div>

          {chatError && <div id="chatError" className="error-box">{chatError}</div>}

          <div id="chatResult">
            {chatResult && (
              <div className={`chat-answer ${chatResult.grounded ? "" : "ungrounded"}`}>
                <span className={`grounded-badge ${chatResult.grounded ? "grounded-true" : "grounded-false"}`}>
                  {chatResult.grounded ? "Grounded" : "Not grounded"}
                </span>
                <div className="chat-answer-text">
                  {chatResult.answer || "(no answer returned)"}
                </div>
                <details>
                  <summary>Show Cypher &amp; raw result</summary>
                  <pre>{chatResult.cypher || "(no cypher returned)"}</pre>
                  <pre>{JSON.stringify(chatResult.result ?? [], null, 2)}</pre>
                </details>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // Mount React Root
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
